[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognition-takehome"
version = "0.1.0"
description = "Event-driven GitHub issue remediation via the Devin API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
]

[tool.setuptools]
packages = ["app"]
