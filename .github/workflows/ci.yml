name: Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: bash scripts/check.sh

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t remediator:test .
      - name: Start container without provider access
        run: |
          docker run --detach --name remediator-smoke \
            -p 127.0.0.1:8000:8000 \
            -e DEVIN_API_KEY=test -e DEVIN_ORG_ID=org-test \
            -e GITHUB_TOKEN=test -e POLL_INTERVAL_SECONDS=0 \
            remediator:test
      - name: Verify startup and restart
        run: |
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --max-time 3 http://127.0.0.1:8000/healthz
          curl --fail http://127.0.0.1:8000/api/tasks
          docker restart remediator-smoke
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --max-time 3 http://127.0.0.1:8000/healthz
      - name: Container logs
        if: always()
        run: docker logs remediator-smoke || true
      - name: Cleanup
        if: always()
        run: docker rm --force remediator-smoke || true
